<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slip Mate</title>
    <link rel="stylesheet" href="popup.css" />
    <script src="url-builder.js"></script>
    <script src="slip-store.js"></script>
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div class="brand-mark" aria-hidden="true">SM</div>
        <div class="brand-copy">
          <h1>Slip Mate</h1>
          <p>Bet365 link maker</p>
        </div>
        <span class="version">V3.1</span>
      </header>

      <section class="status-card" aria-live="polite">
        <div class="status-line">
          <span class="status-dot" id="statusDot"></span>
          <div>
            <strong id="statusTitle">Procurando Bet365…</strong>
            <span id="statusDetail">Abra uma página de esportes.</span>
          </div>
        </div>
        <label class="mode-row" for="modeToggle">
          <span>
            <strong>Modo Slip Mate</strong>
            <small>Use o slip próprio quando quiser</small>
          </span>
          <input id="modeToggle" type="checkbox" role="switch" disabled />
        </label>
      </section>

      <section class="slip-summary">
        <div>
          <span class="eyebrow" id="flowLabel">Slip Mate</span>
          <strong class="count" id="selectionCount">0 seleções</strong>
        </div>
        <div class="total-block">
          <span>Odd aprox.</span>
          <strong id="combinedOdd">—</strong>
        </div>
      </section>

      <button id="copyButton" class="primary" type="button" disabled>Copiar link da aposta</button>
      <button id="clearButton" class="secondary" type="button" disabled>Limpar Slip Mate</button>
      <p id="message" class="message" role="status"></p>

      <footer class="footer">
        <button id="linkButton" type="button">Links</button>
        <span aria-hidden="true">•</span>
        <button id="updateButton" type="button">Atualizações</button>
      </footer>
    </main>
  </body>
</html>
